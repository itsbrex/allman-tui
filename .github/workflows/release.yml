name: release

on:
  push:
    tags:
      - "20*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: x64,   bun: bun-linux-x64 }
          - { arch: arm64, bun: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Download matching allman binary from allman-cli release
        env:
          GH_TOKEN: ${{ secrets.ALLMAN_CLI_TOKEN || secrets.GITHUB_TOKEN }}
          ALLMAN_CLI_VERSION: ${{ vars.ALLMAN_CLI_VERSION || 'latest' }}
        run: |
          mkdir -p .bin
          if [ "$ALLMAN_CLI_VERSION" = "latest" ]; then
            # `gh release download` without a tag skips prereleases; resolve the
            # most recent release (prerelease-inclusive) via `gh release list`.
            tag=$(gh release list --repo tarkaai/allman-cli --limit 1 \
              --json tagName --jq '.[0].tagName')
            if [ -z "$tag" ]; then
              echo "no releases found on tarkaai/allman-cli" >&2
              exit 1
            fi
            echo "resolved latest allman-cli tag: $tag"
          else
            tag="$ALLMAN_CLI_VERSION"
          fi
          gh release download "$tag" --repo tarkaai/allman-cli \
            --pattern "allman-linux-${{ matrix.target.arch }}" \
            --dir .bin
          mv ".bin/allman-linux-${{ matrix.target.arch }}" .bin/allman
          chmod +x .bin/allman

      - name: Build TUI binary
        env:
          ALLMAN_BIN: ${{ github.workspace }}/.bin/allman
          BUN_TARGET: ${{ matrix.target.bun }}
        run: bun scripts/build.ts

      - name: Rename output with arch suffix and checksum
        run: |
          cd dist
          mv allman-tui allman-tui-linux-${{ matrix.target.arch }}
          sha256sum allman-tui-linux-${{ matrix.target.arch }} > allman-tui-linux-${{ matrix.target.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: allman-tui-linux-${{ matrix.target.arch }}
          path: |
            dist/allman-tui-linux-${{ matrix.target.arch }}
            dist/allman-tui-linux-${{ matrix.target.arch }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
